<header class="site-header app-header" data-header data-app-header>
  <div class="container header-inner header-inner--app">
    {% include "partials/brand.html" %}

    <div class="nav-actions">
      {% include "partials/theme_toggle.html" %}
      <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
      <a class="nav-link" href="{% url 'profile' %}">Profile</a>
      <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary btn-sm">Log out</button>
      </form>
      <button
        type="button"
        class="icon-button menu-toggle"
        data-menu-toggle
        aria-expanded="false"
        aria-controls="app-mobile-menu"
        aria-label="Open menu"
      >
        <svg class="menu-icon menu-icon--open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <svg class="menu-icon menu-icon--close" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="app-mobile-menu" data-mobile-menu hidden>
    <nav class="container mobile-menu-inner" aria-label="Account navigation">
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'profile' %}">Profile</a>
      <form method="post" action="{% url 'logout' %}" class="mobile-menu-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary btn-block">Log out</button>
      </form>
    </nav>
  </div>
</header>
